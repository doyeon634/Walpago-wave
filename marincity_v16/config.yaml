# =====================================================================
# 마린시티 호안 월파 위험 예측 – 공통 설정 파일
#   1차(step1_data) · 2차(step2_model) · 3차(step3_dashboard) 모두 이 파일을 읽습니다.
#   [근거] = 출처가 있는 값, [가정] = 자료가 없어 임시로 넣은 값, [결정] = 팀이 정한 값
#   [가정] 값은 자료를 확보하면 교체하고 1차부터 다시 실행하세요.
#
# 변경 이력
#   2026-10-28  최초 작성
#   2026-10-28  10/27 멘토링 반영: 수심 고정 10.5 m(전제 조건), 표본 공간을 설계안대로 (Hs, 파형경사, Rc),
#               여유고 범위를 극한 조건까지 확장, 등급 기준을 국내 기준(KDS 64 10 10)으로 변경
#   2026-10-29  혼합 방식: A(공간 균등)를 Sobol 대신 같은 간격 격자로. B·C는 그대로
#   2026-10-29  3D 그림을 three.js 장면으로 교체, 넘어오는 파도 수 기준을 식 6.3으로 통일
#   2026-11-03  (v14) 태풍 차바 당시 조건 버튼 값 추가
#   2026-10-29  (v7) 단면을 태풍 차바 당시 제방으로 교체 (기립식 차수벽 제거), 조도계수 0.47, 여유고 범위 2.3~6.3 m
# =====================================================================

seed: 2026                       # 재현용 난수 시드 [결정]

# ---------------------------------------------------------------------
# 구조물: 태풍 차바(2016) 당시 마린시티 제방
#   TTP 2층 경사 사면(사석 코어) → 콘크리트 직립벽 → 2012년 방파벽 1.2 m → 산책로 → 도로 → 상가
# ---------------------------------------------------------------------
structure:
  crest_parapet_dl: 6.30         # 방파벽 꼭대기 = 기존 지반 DL+5.1 + 2012년 방파벽 1.2 m [근거: 팀 조사]
  armour_crest_dl: 4.0           # TTP 피복 마루 (방파벽보다 2.3 m 낮음) [근거: 팀 조사, '약 DL+4.0 내외']
  msl_dl: 0.591                  # 평균해면 [근거: 도안]
  water_depth_h: 10.5            # 구조물 앞 수심 h (m), 고정 [결정: 멘토링 "수심 고정", 교수님 제시 10~11 m의 중간값]
  cot_alpha: 1.5                 # 사면 경사 1:1.5 [가정: TTP 피복 일반 경사]
  ttp_ton: 16.0                  # TTP 중량 [근거: 도안]
  rho_c: 2.30                    # 콘크리트 밀도 t/m3 [가정: 일반값]
  gamma_f: 0.47                  # 조도계수 [결정: 교수님 확인. TTP 2층 + 사석 코어 + 그 뒤 콘크리트 직립벽인 복합 구조라
                                 #   EurOtop 표 6.2의 TTP 값(0.38, 투수성 코어)보다 높게 잡음]
  gamma_f_max_long: 0.60         # 장주기 보정 상한 [근거: EurOtop 식 6.7]
  crest_width_m: null            # 피복 천단폭 Gc (m). null 이면 식 6.8 감소 없음(Cr = 1) [가정: 도안상 천단 버름 없음, 식 6.5가 약 3Dn 천단을 이미 포함]
  gamma_beta: 1.0                # 입사각 0도 [결정]

# ---------------------------------------------------------------------
# 공식
# ---------------------------------------------------------------------
formula:
  label_approach: mean           # 정답 라벨: mean = 식 6.5 (평균값 접근) [결정]
  mean:   {a: 0.09,   b: 1.5}    # [근거: EurOtop 식 6.5]
  design: {a: 0.1035, b: 1.35}   # [근거: EurOtop 식 6.6]
  sigma:  {a: 0.0135, b: 0.15}   # 식 6.5 계수의 표준편차 [근거: EurOtop 6.3.1절]
  tp_over_tm10: 1.1              # Tp = 1.1 Tm-1,0 [근거: EurOtop 1.4.2절]
  tp_over_tm: 1.2                # Tp = 1.2 Tm (평균주기) [근거: EurOtop 5장 예제]
  zero_q_lsm: 0.001              # 이 값(l/s/m) 미만은 "월파 없음" [근거: KDS 표 4.3-10의 가장 작은 허용값 1×10⁻⁶ m³/m·s]
  xi_valid: [2.8, 4.5]           # 조도계수 도출 범위 (밖이면 표시만) [근거: EurOtop 6.3.1절]
  runup_cap_permeable: 2.0       # Ru2%/Hm0 상한, 투수성 코어 [근거: EurOtop 식 6.1]

# ---------------------------------------------------------------------
# 허용 월파량과 위험 등급 – 국내 기준
#   KDS 64 10 10 : 2020 (항만 및 어항 설계기준 – 설계조건) 4.3.6.2 해설
#   단위는 l/s per m (원문 m³/m·s × 1000). 파고와 관계없는 고정값.
# ---------------------------------------------------------------------
grades:
  names: [안전, 주의, 위험]
  criteria:
    vehicle_highspeed: 0.001     # 자동차 고속통행 가능 1×10⁻⁶ [근거: 참고 표 4.3-10] (참고용)
    vehicle: 0.02                # 차량 기준: 자동차 운전 가능 2×10⁻⁵ [근거: 참고 표 4.3-10]
    pedestrian: 0.03             # 사람 기준: 보행 위험 없음 3×10⁻⁵ [근거: 참고 표 4.3-10]
    house: 0.07                  # 가옥 위험 없음 7×10⁻⁵ [근거: 참고 표 4.3-10]
    hinterland: 10.0             # 아무것도 없을 때 기준: 배후에 민가·공공시설 밀집 0.01 [근거: 참고 표 4.3-9]
    hinterland_other: 20.0       # 기타 중요한 지역 0.02 [근거: 참고 표 4.3-9] (참고용)
    structure_damage: 200.0      # 호안 피재한계, 배후포장 있음 0.2 [근거: 참고 표 4.3-11] (참고용)
  safe_max: vehicle              # 안전: 차량·사람 기준 중 더 엄격한 값 미만 [결정]
  danger_min: hinterland         # 위험: 배후지 기준(민가 밀집) 이상, 마린시티 해당 [결정]
  building: house                # 건물 피해 가능 표시: 가옥 기준 이상 [결정]

# ---------------------------------------------------------------------
# 파랑 영역 (구조물 앞 Hm0/h)
# ---------------------------------------------------------------------
regime:
  names: [비쇄파, 전환, 쇄파]
  nonbreaking_max: 0.25          # Hm0/h < 0.25 비쇄파 (h/Hm0 > 4) [근거: EurOtop 1.4.6절]
  breaking_min: 0.50             # Hm0/h >= 0.50 쇄파 [근거: 1.4.6절, 환산은 가정]
  breaker_limit: 0.65            # 쇄파 한계, 초과는 제외 [가정: 2.3.2절 예시값, 해저경사 확보 후 교체]

# ---------------------------------------------------------------------
# 1차: 데이터 생성
# ---------------------------------------------------------------------
ranges:                          # 표본 공간 = 설계안대로 (Hs, 파형경사, Rc)
  hs: [0.5, 7.0]                 # 구조물 앞 Hm0 (m). 쇄파 한계로 실제 상한 = 0.65 × 수심 10.5 m ≈ 6.8 m
  steepness: [0.01, 0.06]        # Tp 기준 파형경사 [근거: EurOtop 1.4.3절, 너울 0.01 ~ 풍파 0.06]
  rc: [2.3, 6.3]                 # 여유고 (m) = 방파벽 꼭대기 DL+6.3 − 정수위
                                 #   최대 6.3: 정수위 DL 0 (기본수준면, 가장 낮은 바닷물 높이)
                                 #   최소 2.3: 정수위 DL+4.0 = TTP 마루가 물에 잠기기 직전. 이보다 높으면 TTP 가 잠겨
                                 #             사석 경사제 공식의 전제가 깨짐. 차바(DL+2.18, 여유고 4.12 m)보다 1.8 m 높은 극한까지 포함
                                 # [결정: 10/29, 아래 줄은 이전 설명]
                                 #   그보다 높은 수위(극한, Rc 1~4 m)를 포함]

sampling:
  total: 3000                    # 학습용 전체 건수 [근거: 설계안]
  grid:                          # A. 격자 (최솟값부터 같은 간격) [결정: 10/29 혼합 방식]
    hs_step: 0.6                 #   파고 0.5, 1.1, 1.7 … 6.5 m (11단계)
    tp_levels: 10                #   주기: 파고마다 가능한 범위(파형경사 0.06~0.01)를 같은 간격 10단계
    rc_step: 0.25                #   여유고 2.3, 2.55 … 6.3 m (17단계)  → 11 × 10 × 17 = 1,870건
  n_edge: 200                    # C. 범위 가장자리
                                 # B. 등급 경계 집중 = total − 격자 − 가장자리 (= 985건)
  candidates_per_batch: 4096     # Sobol 2의 거듭제곱
  boundary_delta: 0.4            # log10 q 경계 ±δ [결정: 설계안 0.3~0.5 중간]
  cell_min: 100                  # 9칸 칸당 최소 [근거: 설계안]
  grade_min_ratio: 0.15
  grade_max_ratio: 0.45
  dedupe_distance: 0.01          # 정규화 입력공간 최근접 거리 [결정]
  round_decimals: 2
  split: {train: 0.70, val: 0.15, test: 0.15}
  eval_boundary_n: 300
  eval_boundary_delta: 0.2
  eval_outside_n: 200
  eval_outside_extend: 0.15      # 범위 밖 시험: 각 범위 바깥 15% [결정]

# ---------------------------------------------------------------------
# 2차: 모델 학습
# ---------------------------------------------------------------------
model:
  n_estimators: 200
  max_depth_grid: [null, 12, 8]
  min_samples_leaf_grid: [1, 3, 5]
  calibration_bins: 10

# ---------------------------------------------------------------------
# 3차: 대시보드
# ---------------------------------------------------------------------
dashboard:
  mc_samples: 4000               # 경험식 확률·90% 범위용 계수 표본 수
  default: {hs: 5.0, tp: 15.0, rc: 4.12}
  chaba:                         # 태풍 차바(2016) 당시 조건 (버튼)
    hs: 6.75                     # 호안 앞 파고 [근거: 외해 유의파고 8.1 m(북항)가 수심 10.5 m 에서 부서져
                                 #   호안 앞 최대 약 0.65 × 10.5 ≈ 6.8 m 로 제한됨 → 입력 범위 최댓값. 호안 앞 실측값은 없음]
    tp: 15.0                     # 주기 [근거: 차바 논문, 마린시티 앞 Tp ≈ 15 s]
    rc: 4.12                     # 여유고 = 방파벽 꼭대기 DL+6.30 − 최고 수위 DL+2.18 [근거: 차바 논문 최대조위 218 cm]   # 처음 화면 값 (차바와 비슷한 조건). 슬라이더 범위는 학습 범위에서 자동으로 읽음
  section:                       # 2D·3D 그림용 (등급 계산에는 영향 없음)
    ground_dl: 5.1               # 산책로 바닥 [근거: 팀 조사]
    parapet_width: 1.0           # 방파벽 두께 [가정: 사진]
    buffer_width: 1.0            # 방파벽 바로 뒤가 산책로 (재해완충구역 없음) → 방파벽 두께와 같게
    gap_width: 0.0
    walkway_width: 6.0           # 보행로 [근거: 팀 조사 5~7 m 의 중간값]
    road_width: 17.5             # 배후 도로 [근거: 팀 조사 15~20 m 의 중간값]
    building_setback: 0.0        # 도로 끝이 상가 (방파벽에서 상가까지 약 24.5 m, 조사값 20~25 m)
    berm_width: 5.0              # TTP 마루 폭 (직립벽 앞 수평 구간) [가정: TTP 두 개 정도, 그림에만 사용]

# ---------------------------------------------------------------------
# 파일 위치 (프로젝트 폴더 기준)
# ---------------------------------------------------------------------
paths:
  scenarios: step1_data/output/scenarios.csv
  eval_boundary: step1_data/output/eval_boundary.csv
  eval_outside: step1_data/output/eval_outside.csv
  filter_log: step1_data/output/filter_log.csv
  data_report: step1_data/output/validation_report.md
  data_card: step1_data/output/data_card.md
  coverage_png: step1_data/output/coverage.png
  model: step2_model/output/rf_model.joblib
  model_meta: step2_model/output/model_meta.json
  model_report: step2_model/output/model_report.md
  calibration_png: step2_model/output/calibration.png
